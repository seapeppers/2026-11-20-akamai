[project]
name = "packserve-akamai"
version = "0.1.0"
description = "PackServe-style GPU pool scheduler with serverless burst (Akamai hackathon demo)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "jinja2>=3.1",
    "openai>=1.40",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packserve", "validation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
